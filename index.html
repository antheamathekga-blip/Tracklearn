<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackLearn LMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff}
.top{padding:12px 16px;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between}
.flex{display:flex}
.side{width:180px;border-right:1px solid #E5E7EB;padding:10px;height:calc(100vh - 45px)}
.side div{padding:9px;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:14px}
.side div:active{transform:scale(0.97)}
.side .active{background:#FFEDD5;color:#EA580C;font-weight:700}
.main{flex:1;padding:16px}
.card{border:1px solid #E5E7EB;border-radius:8px;padding:12px;margin:8px 0}
button{background:#EA580C;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
button:active{background:#000}
#popup{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:9999}
#popup.show{display:flex}
#login{position:fixed;left:0;top:0;width:100%;height:100%;background:#fff;z-index:10000;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div id="login"><div style="border:1px solid #ddd;padding:20px;border-radius:10px;width:280px;text-align:center"><b style="color:#EA580C">TrackLearn LMS</b><br><br><input id="n" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px" placeholder="Banele"><input id="r" style="width:100%;padding:8px;margin-top:6px;border:1px solid #ddd;border-radius:6px" value="learner"><br><br><button style="width:100%" onclick="LOGIN()">LOGIN</button></div></div>

<div class="top"><b>📖 TrackLearn</b><span id="who"></span></div>

<div class="flex">
<div class="side">
<div id="s1" class="active" onclick="DASH()">🏠 Dashboard</div>
<div id="s2" onclick="STUD()">👥 Students</div>
<div id="s3" onclick="COUR()">📚 Courses</div>
<div id="s4" onclick="ANAL()">📊 Analytics</div>
<div id="s5" onclick="SETT()">⚙️ Settings</div>
<div id="s6" onclick="HELP()">❓ Help</div>
<div onclick="document.getElementById('login').style.display='flex'">🚪 Logout</div>
</div>
<div class="main" id="M"></div>
</div>

<div id="popup"><div style="background:#fff;padding:16px;border-radius:10px;width:280px;text-align:center"><h4>You're Falling Behind</h4><p style="font-size:12px;color:#666;margin:8px 0">30% behind in Business Analytics</p><button style="width:100%" onclick="document.getElementById('popup').classList.remove('show')">Continue Learning →</button></div></div>

<script>
function CLR(){document.querySelectorAll('.side div').forEach(e=>e.classList.remove('active'))}
function LOGIN(){
let name=document.getElementById('n').value;let role=document.getElementById('r').value.toLowerCase();
if(!name)return alert('Enter name');
document.getElementById('login').style.display='none';
document.getElementById('who').innerText=name;
if(role==='learner' && (name.toLowerCase()=='banele'||name.toLowerCase()=='osamar')){document.getElementById('popup').classList.add('show')}
DASH();
}
function DASH(){CLR();document.getElementById('s1').classList.add('active');document.getElementById('M').innerHTML='<h3>Dashboard</h3><div class="card">Total Students 128<br><br><button onclick="STUD()">View Students</button> <button onclick="COUR()">View Courses</button> <button onclick="ANAL()">View Analytics</button></div>';}
function STUD(){CLR();document.getElementById('s2').classList.add('active');document.getElementById('M').innerHTML='<h3>Students</h3><div class="card">Banele - 30% BEHIND <button onclick="alert(\'Email sent to Banele - 6PM report\')">Email</button> <button onclick="alert(\'Profile opened\')">View</button></div><div class="card">Siviwe - 85% ON TRACK <button onclick="alert(\'Email sent\')">Email</button> <button onclick="alert(\'Profile\')">View</button></div><div class="card"><button onclick="alert(\'New student added to Supabase\')">+ Add Student</button></div>';}
function COUR(){CLR();document.getElementById('s3').classList.add('active');document.getElementById('M').innerHTML='<h3>Courses</h3><div class="card">Business Analytics <button onclick="alert(\'Business Analytics opened\')">Open</button> <button onclick="alert(\'Enrolled\')">Enroll</button></div><div class="card">Data Science 101 <button onclick="alert(\'Data Science opened\')">Open</button> <button onclick="alert(\'Enrolled\')">Enroll</button></div><div class="card">Marketing <button onclick="alert(\'Marketing opened\')">Open</button></div>';}
function ANAL(){CLR();document.getElementById('s4').classList.add('active');document.getElementById('M').innerHTML='<h3>Analytics</h3><div class="card">Completion 76%<br><br><button onclick="alert(\'Downloading report...\')">Download Report</button> <button onclick="alert(\'Chart opened\')">View Chart</button></div>';}
function SETT(){CLR();document.getElementById('s5').classList.add('active');document.getElementById('M').innerHTML='<h3>Settings</h3><div class="card"><button onclick="alert(\'Settings saved\')">Save Settings</button> <button onclick="alert(\'Supabase connected\')">Test Supabase</button></div>';}
function HELP(){CLR();document.getElementById('s6').classList.add('active');document.getElementById('M').innerHTML='<h3>Help</h3><div class="card"><button onclick="alert(\'Help docs opened\')">Open Docs</button> <button onclick="alert(\'Support contacted\')">Contact Support</button></div>';}
</script>
</body>
</html>
