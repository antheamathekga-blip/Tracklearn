<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackLearn</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fff;overflow-x:hidden}
.header{background:#EDE7FF;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;position:sticky;top:0;z-index:100}
.logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:28px;color:#7C5CBF;letter-spacing:-0.5px}
.menu{width:32px;height:22px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.menu span{display:block;height:3px;background:#7C5CBF;border-radius:10px}
.hero{position:relative;width:100%;height:82vh;background:#fff}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center top}
.card{
 position:absolute;left:16px;right:16px;bottom:24px;
 background:rgba(232,232,232,0.78);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-radius:20px;padding:20px 16px 22px;text-align:center;
 box-shadow:0 12px 40px rgba(0,0,0,0.18)
}
.card h1{font-family:'Poppins';font-weight:800;font-size:29px;line-height:1.18;color:#111827}
.card h1 .purple{color:#6C4DB3}
.card p{margin-top:10px;font-size:14.5px;line-height:1.55;color:#4B5563}
.btns{margin-top:18px;display:flex;gap:12px;justify-content:center}
.btn{border-radius:999px;padding:13px 26px;font-weight:600;font-size:15px;border:none;cursor:pointer}
.btn-fill{background:#7C5CBF;color:#fff}
.btn-outline{background:#EFEBFF;color:#5B45A0;border:1.8px solid #7C5CBF}
.bar{background:#5D3EA8;height:56px;width:100%}
</style>
</head>
<body>
<div class="header">
  <div class="logo">TrackLearn</div>
  <div class="menu"><span></span><span></span><span></span></div>
</div>

<div class="hero">
  <!-- REPLACE src with your Suthraya hero image -->
  <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=80" alt="students">
  <div class="card">
    <h1>Empower Your Growth,<br><span class="purple">Connect with Experts</span></h1>
    <p>Discover insights from professionals and scale your potential. Explore opportunities with a growing community of experts.</p>
    <div class="btns">
      <button class="btn btn-fill" onclick="alert('Sign up - TrackLearn LMS')">Sign up now</button>
      <button class="btn btn-outline">Explore</button>
    </div>
  </div>
</div>

<div class="bar"></div>
</body>
</html>
