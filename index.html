<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackLearn LMS - 8 IT Courses</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#fff}
.top{padding:12px 18px;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between;align-items:center;background:#fff;position:sticky;top:0;z-index:10}
.flex{display:flex}
.side{width:200px;border-right:1px solid #E5E7EB;padding:10px;height:calc(100vh - 50px);background:#fff;overflow:auto}
.side div{padding:10px 12px;border-radius:8px;margin-bottom:4px;cursor:pointer;font-size:14px;color:#4B5563}
.side .active{background:#FFEDD5;color:#EA580C;font-weight:700}
.main{flex:1;padding:18px;background:#F9FAFB;height:calc(100vh - 50px);overflow:auto}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:14px}
button{background:#EA580C;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;margin:2px}
button.secondary{background:#fff;color:#111827;border:1px solid #E5E7EB}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px;text-align:left;border-bottom:1px solid #E5E7EB;color:#6B7280;background:#F9FAFB}
td{padding:10px;border-bottom:1px solid #F3F4F6}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}
.behind{background:#FEE2E2;color:#DC2626}
.ontrack{background:#D1FAE5;color:#059669}
.atrisk{background:#FEF3C7;color:#D97706}
.search, select, input[type=text]{width:100%;padding:10px;border:1px solid #E5E7EB;border-radius:8px;margin-bottom:10px}
select{cursor:pointer;background:#fff}
.checkboxGroup{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.checkboxGroup label{display:flex;align-items:center;gap:6px;font-size:13px;background:#F9FAFB;padding:6px 10px;border-radius:20px;border:1px solid #E5E7EB;cursor:pointer}
.checkboxGroup input[type=checkbox]{width:16px;height:16px}
.ok{margin-top:8px;padding:8px;background:#ECFDF5;border:1px solid #10B981;border-radius:6px;font-size:12px;display:none}
.ok.show{display:block}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9999}
#popup.show{display:flex}
#login{position:fixed;inset:0;background:#fff;z-index:10000;display:flex;align-items:center;justify-content:center}
.popupBox{background:#fff;padding:22px;border-radius:16px;width:360px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.courseGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
</style>
</head>
<body>

<div id="login"><div style="border:1px solid #E5E7EB;padding:24px;border-radius:16px;width:380px;text-align:center"><div style="color:#EA580C;font-weight:800;font-size:20px">📖 TrackLearn LMS</div><p style="font-size:12px;color:#6B7280;margin:8px 0">8 IT Courses | 8 Students</p>
<!-- DROPDOWN FOR STUDENTS -->
<label style="font-size:12px;text-align:left;display:block;margin-bottom:4px">Select Student (Dropdown)</label>
<select id="n" onchange="autoFill()">
<option value="">-- Choose Student --</option>
<option value="Banele Nkosi">Banele Nkosi - 30% Behind</option>
<option value="Siviwe Dlamini">Siviwe Dlamini - 85% On Track</option>
<option value="Anthea Mathekga">Anthea Mathekga - 76% On Track</option>
<option value="John Smith">John Smith - 92% On Track</option>
<option value="Lerato Molefe">Lerato Molefe - 28% Behind</option>
<option value="David Lee">David Lee - 88% On Track</option>
<option value="Priya Patel">Priya Patel - 95% On Track</option>
<option value="Kagiso Rabada">Kagiso Rabada - 22% Behind</option>
</select>
<label style="font-size:12px;text-align:left;display:block;margin:8px 0 4px">Role (Dropdown)</label>
<select id="r"><option value="learner">Learner / Student</option><option value="admin">Admin</option><option value="instructor">Worker / Instructor</option></select>
<label style="font-size:12px;text-align:left;display:block;margin:8px 0 4px">IT Course (Dropdown)</label>
<select id="courseSelect"><option>Web Development</option><option>Data Science</option><option>Cybersecurity</option><option>Cloud Computing</option><option>Artificial Intelligence</option><option>Software Engineering</option><option>Network Administration</option><option>Database Management</option></select>
<div style="text-align:left;margin-top:10px"><label style="font-size:12px">Learning Modules (Checkbox)</label><div class="checkboxGroup"><label><input type="checkbox" checked> Videos</label><label><input type="checkbox" checked> Quizzes</label><label><input type="checkbox"> Assignments</label><label><input type="checkbox"> Projects</label></div></div>
<button style="width:100%;margin-top:12px;padding:10px" onclick="LOGIN()">Login to LMS</button>
</div></div>

<div class="top"><b>📖 TrackLearn LMS - 8 IT Courses</b><span id="who" style="font-size:13px;color:#6B7280"></span></div>

<div class="flex">
<div class="side">
<div id="s1" class="active" onclick="DASH()">🏠 Dashboard</div>
<div id="s2" onclick="STUD()">👥 Students (8)</div>
<div id="s3" onclick="COUR()">💻 IT Courses (8)</div>
<div id="s4" onclick="WORK()">👷 Workers (4)</div>
<div id="s5" onclick="ANAL()">📊 Analytics</div>
<div id="s6" onclick="ENROLL()">📝 Enroll</div>
<div id="s7" onclick="SETT()">⚙️ Settings</div>
<div onclick="location.reload()">🚪 Logout</div>
</div>
<div class="main" id="M"></div>
</div>

<div id="popup"><div class="popupBox" id="popupBox"></div></div>

<script>
const students=[
{name:'Banele Nkosi',email:'banele@test.com',course:'Web Development',progress:30,status:'behind',modules:['Videos','Quizzes']},
{name:'Siviwe Dlamini',email:'siviwe@test.com',course:'Data Science',progress:85,status:'ontrack',modules:['Videos','Quizzes','Projects']},
{name:'Anthea Mathekga',email:'anthea@test.com',course:'Cybersecurity',progress:76,status:'ontrack',modules:['Videos','Assignments']},
{name:'John Smith',email:'john@test.com',course:'Cloud Computing',progress:92,status:'ontrack',modules:['Videos','Quizzes','Assignments','Projects']},
{name:'Lerato Molefe',email:'lerato@test.com',course:'Artificial Intelligence',progress:28,status:'behind',modules:['Videos']},
{name:'David Lee',email:'david@test.com',course:'Software Engineering',progress:88,status:'ontrack',modules:['Videos','Projects']},
{name:'Priya Patel',email:'priya@test.com',course:'Network Administration',progress:95,status:'ontrack',modules:['Videos','Quizzes','Assignments','Projects']},
{name:'Kagiso Rabada',email:'kagiso@test.com',course:'Database Management',progress:22,status:'behind',modules:['Videos']}
];
const courses=[
{title:'Web Development',code:'IT101',students:45,duration:'12 Weeks',level:'Beginner',instructor:'Dr. James Wilson',modules:['HTML/CSS','JavaScript','React','Node.js']},
{title:'Data Science',code:'IT102',students:38,duration:'16 Weeks',level:'Intermediate',instructor:'Prof. Sarah Chen',modules:['Python','Statistics','Machine Learning','Visualization']},
{title:'Cybersecurity',code:'IT103',students:32,duration:'14 Weeks',level:'Advanced',instructor:'Anthea Mathekga',modules:['Network Security','Ethical Hacking','Cryptography','Risk Mgmt']},
{title:'Cloud Computing',code:'IT104',students:28,duration:'10 Weeks',level:'Intermediate',instructor:'John Smith',modules:['AWS','Azure','Docker','Kubernetes']},
{title:'Artificial Intelligence',code:'IT105',students:22,duration:'20 Weeks',level:'Advanced',instructor:'Dr. James Wilson',modules:['AI Basics','Neural Networks','Deep Learning','NLP']},
{title:'Software Engineering',code:'IT106',students:40,duration:'18 Weeks',level:'Intermediate',instructor:'David Lee',modules:['SDLC','Agile','Testing','DevOps']},
{title:'Network Administration',code:'IT107',students:25,duration:'12 Weeks',level:'Beginner',instructor:'Priya Patel',modules:['Networking','TCP/IP','Routers','Security']},
{title:'Database Management',code:'IT108',students:30,duration:'10 Weeks',level:'Beginner',instructor:'Lerato Molefe',modules:['SQL','MySQL','MongoDB','Optimization']}
];
const workers=[
{name:'Dr. James Wilson',role:'IT Lead Instructor',expertise:'Web, AI',courses:2},
{name:'Prof. Sarah Chen',role:'Data Science Instructor',expertise:'Python, ML',courses:1},
{name:'Anthea Mathekga',role:'Cybersecurity Expert',expertise:'Security',courses:1},
{name:'David Lee',role:'Software Engineer',expertise:'DevOps',courses:1}
];
function autoFill(){let v=document.getElementById('n').value;let s=students.find(x=>x.name===v);if(s){document.getElementById('courseSelect').value=s.course;}}
function CLR(){document.querySelectorAll('.side div').forEach(e=>e.classList.remove('active'))}
function closePop(){document.getElementById('popup').classList.remove('show');}
function LOGIN(){
let name=document.getElementById('n').value.trim();
let role=document.getElementById('r').value;
let course=document.getElementById('courseSelect').value;
let checks=[...document.querySelectorAll('.checkboxGroup input:checked')].map(c=>c.nextSibling?c.parentElement.innerText.trim():c.value);
if(!name)return alert('Select student from dropdown');
document.getElementById('login').style.display='none';
document.getElementById('who').innerText=name+' ('+role+') | '+course;
let me=students.find(s=>s.name===name);
if(role==='learner'&&me&&(me.status==='behind')){
document.getElementById('popupBox').innerHTML=`<div style="width:50px;height:50px;background:#FEE2E2;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px">⚠️</div><h3>You're Falling Behind</h3><p style="font-size:13px;color:#6B7280;margin:12px 0">Hi <b>${me.name}</b><br>You are <b style="color:#DC2626">${me.progress}% behind</b> in <b>${me.course}</b><br>Modules: ${checks.join(', ')}<br>Facilitator notified for follow up.</p><button style="width:100%;padding:10px;background:#DC2626" onclick="closePop()">Continue Learning →</button>`;
document.getElementById('popup').classList.add('show');
console.log(`FACILITATOR REPORT: ${me.name} ${me.progress}% behind in ${me.course} - Email to facilitator@tracklearn.com`);
}
DASH();
}
function DASH(){CLR();document.getElementById('s1').classList.add('active');document.getElementById('M').innerHTML=`<h2>Dashboard - 8 IT Courses</h2><p style="font-size:13px;color:#6B7280;margin:6px 0 12px">8 Students | 8 IT Courses | 4 Workers</p><div class="grid4"><div class="stat"><small>IT Courses</small><h2>8</h2><small>All IT fields</small></div><div class="stat"><small>Students</small><h2>8</h2><small>Active</small></div><div class="stat"><small>Behind - Warning</small><h2 style="color:#DC2626">${students.filter(s=>s.status==='behind').length}</h2><small>Get warning</small></div><div class="stat"><small>On Track</small><h2 style="color:#059669">${students.filter(s=>s.status==='ontrack').length}</h2></div></div><div class="card"><b>8 IT Courses Available</b><br><br>${courses.map(c=>`<small>• <b>${c.title}</b> (${c.code}) - ${c.duration} - ${c.level}</small><br>`).join('')}<br><button onclick="STUD()">View 8 Students</button> <button onclick="COUR()">View 8 IT Courses</button></div>`;}
function STUD(){CLR();document.getElementById('s2').classList.add('active');let rows=students.map(s=>`<tr><td><b>${s.name}</b><br><small>${s.email}</small></td><td><select style="padding:4px;border-radius:6px;border:1px solid #E5E7EB"><option ${s.course==='Web Development'?'selected':''}>Web Development</option><option ${s.course==='Data Science'?'selected':''}>Data Science</option><option ${s.course==='Cybersecurity'?'selected':''}>Cybersecurity</option><option ${s.course==='Cloud Computing'?'selected':''}>Cloud Computing</option><option ${s.course==='Artificial Intelligence'?'selected':''}>Artificial Intelligence</option><option ${s.course==='Software Engineering'?'selected':''}>Software Engineering</option><option ${s.course==='Network Administration'?'selected':''}>Network Administration</option><option ${s.course==='Database Management'?'selected':''}>Database Management</option></select></td><td>${s.progress}%</td><td><span class="badge ${s.status}">${s.status}</span></td><td><label style="font-size:11px"><input type="checkbox" ${s.progress>50?'checked':''}> Email Report</label><br><label style="font-size:11px"><input type="checkbox" checked> Active</label></td><td><button onclick="this.nextElementSibling.classList.add('show');console.log('Report to facilitator@tracklearn.com: ${s.name} ${s.progress}% ${s.course}')">📧 Email Facilitator</button><div class="ok">✓ Report sent to facilitator@tracklearn.com - ${s.name} - ${s.progress}% in ${s.course} - Follow up needed</div></td></tr>`).join('');document.getElementById('M').innerHTML=`<h2>Students - 8 Total</h2><div style="display:flex;gap:10px;margin-bottom:10px"><select style="flex:1"><option>Filter by Course (Dropdown)</option><option>Web Development</option><option>Data Science</option><option>Cybersecurity</option><option>Cloud Computing</option><option>Artificial Intelligence</option><option>Software Engineering</option><option>Network Administration</option><option>Database Management</option></select><select style="flex:1"><option>Filter by Status (Dropdown)</option><option>Behind</option><option>On Track</option><option>At Risk</option></select></div><div class="card" style="padding:0;overflow:hidden"><table><tr><th>Name</th><th>IT Course (Dropdown)</th><th>Progress</th><th>Status</th><th>Options (Checkbox)</th><th>Facilitator Follow Up</th></tr>${rows}</table></div>`;}
function COUR(){CLR();document.getElementById('s3').classList.add('active');document.getElementById('M').innerHTML=`<h2>8 Different IT Courses</h2><div class="courseGrid">${courses.map(c=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><div><b>${c.title}</b><br><small style="color:#EA580C">${c.code} | ${c.level} | ${c.duration}</small><br><small style="color:#6B7280">${c.instructor} | ${c.students} students</small></div><span class="badge ontrack">${c.level}</span></div><br><small><b>Modules:</b></small><div class="checkboxGroup">${c.modules.map(m=>`<label><input type="checkbox" checked> ${m}</label>`).join('')}</div><br><div style="display:flex;gap:6px"><select style="flex:1;padding:6px"><option>Enroll Student (Dropdown)</option>${students.map(s=>`<option>${s.name}</option>`).join('')}</select><button onclick="this.nextElementSibling.classList.add('show')">Enroll</button></div><div class="ok">✓ Student enrolled in ${c.title} - Report sent to facilitator</div></div>`).join('')}</div>`;}
function WORK(){CLR();document.getElementById('s4').classList.add('active');document.getElementById('M').innerHTML=`<h2>Workers / Instructors - 4 IT Experts</h2><div class="card" style="padding:0;overflow:hidden"><table><tr><th>Name</th><th>Role (Dropdown)</th><th>Expertise</th><th>IT Courses</th><th>Available (Checkbox)</th></tr>${workers.map(w=>`<tr><td><b>${w.name}</b></td><td><select style="padding:4px;border-radius:6px"><option>${w.role}</option><option>IT Lead Instructor</option><option>Data Science Instructor</option><option>Cybersecurity Expert</option><option>Software Engineer</option></select></td><td>${w.expertise}</td><td>${w.courses}</td><td><label><input type="checkbox" checked> Available</label> <label><input type="checkbox"> Email Notifications</label></td></tr>`).join('')}</table></div>`;}
function ENROLL(){CLR();document.getElementById('s6').classList.add('active');document.getElementById('M').innerHTML=`<h2>Enroll Students - Dropdown + Checkbox</h2><div class="card"><label>Select Student (Dropdown)</label><select>${students.map(s=>`<option>${s.name} - ${s.course} (${s.progress}%)</option>`).join('')}</select><label>Select IT Course (Dropdown)</label><select>${courses.map(c=>`<option>${c.title} - ${c.code} - ${c.level}</option>`).join('')}</select><label>Select Modules (Checkbox - Choose many)</label><div class="checkboxGroup"><label><input type="checkbox" checked> HTML/CSS/JS</label><label><input type="checkbox" checked> Python</label><label><input type="checkbox"> Cybersecurity Basics</label><label><input type="checkbox"> Cloud (AWS/Azure)</label><label><input type="checkbox"> AI/ML</label><label><input type="checkbox"> Databases</label><label><input type="checkbox"> Networking</label><label><input type="checkbox"> DevOps</label></div><label>Options (Checkbox)</label><div class="checkboxGroup"><label><input type="checkbox" checked> Send email to facilitator</label><label><input type="checkbox" checked> Active enrollment</label><label><input type="checkbox"> Daily 6PM reports</label></div><button onclick="this.nextElementSibling.classList.add('show')">📝 Enroll Student + Email Facilitator</button><div class="ok">✓ Student enrolled in IT course - Facilitator notified at facilitator@tracklearn.com for follow up - Report logged</div></div>`;}
function ANAL(){CLR();document.getElementById('s5').classList.add('active');document.getElementById('M').innerHTML=`<h2>Analytics - 8 IT Courses</h2><div class="grid4"><div class="stat"><small>Behind - Warning + Facilitator Email</small><h2 style="color:#DC2626">${students.filter(s=>s.status==='behind').length}</h2></div><div class="stat"><small>On Track</small><h2 style="color:#059669">${students.filter(s=>s.status==='ontrack').length}</h2></div><div class="stat"><small>IT Courses</small><h2>8</h2></div><div class="stat"><small>Avg Progress</small><h2>61%</h2></div></div><div class="card"><b>8 IT Courses Performance</b><br><br>${courses.map(c=>`<div style="margin:8px 0;display:flex;justify-content:space-between"><span>${c.title} (${c.students} students)</span><span>${Math.floor(Math.random()*20+70)}%</span></div>`).join('')}<br><button onclick="this.nextElementSibling.classList.add('show')">📧 Send All Behind Reports to Facilitator</button><div class="ok">✓ ${students.filter(s=>s.status==='behind').length} reports sent to facilitator@tracklearn.com - Follow up needed: ${students.filter(s=>s.status==='behind').map(s=>s.name).join(', ')}</div></div>`;}
function SETT(){CLR();document.getElementById('s7').classList.add('active');document.getElementById('M').innerHTML=`<h2>Settings - Dropdown & Checkbox Config</h2><div class="card"><label>Facilitator Email (Dropdown)</label><select><option>facilitator@tracklearn.com</option><option>admin@tracklearn.com</option><option>anthea@tracklearn.com</option></select><label>Report Frequency (Dropdown)</label><select><option>Daily 6PM</option><option>Weekly</option><option>Instant on Behind</option></select><label>Notifications (Checkbox)</label><div class="checkboxGroup"><label><input type="checkbox" checked> Email facilitator on behind login</label><label><input type="checkbox" checked> Daily 6PM summary</label><label><input type="checkbox"> SMS alerts</label><label><input type="checkbox" checked> Supabase logging</label></div><button onclick="this.nextElementSibling.classList.add('show')">Save Settings</button><div class="ok">✓ Settings saved - Facilitator reports enabled</div></div>`;}
DASH();
</script>
</body>
</html>
