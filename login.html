<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><style>body{font-family:sans-serif;background:#FFFBF7;display:flex;justify-content:center;align-items:center;min-height:100vh} .c{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.08);border:1px solid #FFDDC0} input{width:100%;padding:12px;border:1.5px solid #FFDDC0;border-radius:10px;margin-bottom:10px;box-sizing:border-box} button{width:100%;padding:12px;background:#FF9A45;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer} a{color:#FF8A2E;text-decoration:none;font-size:13px}</style></head><body><div class="c"><h2 style="color:#FF8A2E;text-align:center">TrackLearn</h2><p style="text-align:center;font-size:13px;color:#888;margin-bottom:16px">Sign up or Login</p><input id="n" placeholder="Full Name"><input id="e" placeholder="Email" type="email"><input id="p" placeholder="Password" type="password"><button onclick="go()">Sign up now</button><p style="text-align:center;margin-top:14px"><a href="index.html">← Back Home</a></p><p id="m" style="text-align:center;color:#FF8A2E;font-size:12px;margin-top:8px"></p></div><script>function go(){const e=document.getElementById('e').value;if(!e){document.getElementById('m').innerText='Enter email';return}localStorage.setItem('user',e);document.getElementById('m').innerText='Opening...';setTimeout(()=>location.href='dashboard.html',600)}</script></body></html>
