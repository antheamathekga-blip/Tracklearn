<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,sans-serif;padding:20px;background:#FFFBF7}.card{background:white;padding:18px;border-radius:14px;border:1px solid #FFDDC0;margin-bottom:16px}.btn{background:#FF9A45;color:white;border:none;padding:12px;border-radius:10px;width:100%;font-weight:700;cursor:pointer}input,select{padding:11px;border:1.5px solid #FFDDC0;border-radius:10px;width:100%} .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{width:100%;border-collapse:collapse}.table th{background:#FFF5EB;color:#FF8A2E;padding:10px;text-align:left}.table td{padding:10px;border-bottom:1px solid #FFEEE0}</style></head><body>
<div class="card"><h3>Add New Learner</h3><div class="form"><input id="name" placeholder="Full Name"><input id="email" placeholder="Email"><select id="course"><option>Web Development</option><option>Data Science</option><option>Cybersecurity</option><option>Cloud Computing</option></select><input id="progress" type="number" placeholder="Progress %"></div><button class="btn" onclick="addLearner()">+ Add Learner</button><p id="statusMsg" style="color:#d00"></p></div>
<div class="card"><h3>Learner Activity Tracking</h3><div id="list">Loading...</div><p>Total: <b id="total">0</b> | Inactive: <b id="inactiveCount">0</b></p></div>
<script>
const client=supabase.createClient("https://fimoqlvsjzgibuxwutcf.supabase.co","sb_publishable_bMIt_LUDEXHeZN0D3RoQIA_ke5NdUlu");
const TABLE="students"; let learners=[];
async function load(){
  const {data,error}=await client.from(TABLE).select('*').order('id',{ascending:false});
  if(error){document.getElementById('list').innerHTML='<span style=color:red>'+error.message+'</span>';return;}
  learners=data; render();
}
function render(){
  document.getElementById('total').innerText=learners.length;
  document.getElementById('list').innerHTML='<table class=table><tr><th>Name</th><th>Email</th><th>Course</th><th>Progress</th><th>Status</th></tr>'+learners.map(s=>`<tr><td>${s.name}</td><td>${s.email}</td><td>${s.course}</td><td>${s.progress||0}%</td><td>${s.status||'Active'}</td></tr>`).join('')+'</table>';
}
async function addLearner(){
  const n=document.getElementById('name').value.trim();
  const e=document.getElementById('email').value.trim();
  const c=document.getElementById('course').value;
  const p=parseInt(document.getElementById('progress').value)||0;
  if(!n||!e){alert('name & email required');return;}
  document.getElementById('statusMsg').innerText='Saving...';
  const {error}=await client.from(TABLE).insert([{name:n,email:e,course:c,progress:p,status:'Active',last_active:new Date().toISOString()}]);
  if(error) document.getElementById('statusMsg').innerText='Error: '+error.message;
  else {document.getElementById('statusMsg').innerText='Saved!'; load();}
}
load();
</script></body></html>
